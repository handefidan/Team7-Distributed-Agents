<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Team 7 - Distributed AI Platform</title>
  <style>
    body { font-family: sans-serif; background: #f8fafc; color: #0f172a; padding: 20px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    textarea { width: 100%; height: 120px; box-sizing: border-box; padding: 8px; }
    button { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 10px 18px; cursor: pointer; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #e2e8f0; padding: 8px; text-align: left; }
    th { background: #f1f5f9; }
  </style>
</head>
<body>
  <div style="max-width: 900px; margin: 0 auto;">
    <h1>Distributed AI Platform</h1>
    <p>CM6453 Sprint 1 Increment</p>

    <div class="card">
      <h2>1. Registered Agents</h2>
      <table id="agentsTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Model</th>
            <th>Capabilities</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="agentsBody">
          <tr><td colspan="5">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="card">
      <h2>2. Master Agent - Task Decomposition</h2>
      <textarea id="reqInput" placeholder="Enter requirements here..."></textarea><br><br>
      <button onclick="handleDecompose()">Decompose Requirements</button>
    </div>

    <div class="card" id="outputCard" style="display:none;">
      <h2 id="outTitle">Tasks</h2>
      <table>
        <thead>
          <tr>
            <th>Task ID</th>
            <th>Title</th>
            <th>Domain</th>
            <th>Description</th>
            <th>Dependencies</th>
          </tr>
        </thead>
        <tbody id="tasksBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API = "http://localhost:8000";

    async function loadAgents() {
      try {
        const res = await fetch(`${API}/api/agents`);
        const data = await res.json();
        const tbody = document.getElementById("agentsBody");
        tbody.innerHTML = "";
        data.forEach(a => {
          tbody.innerHTML += `
            <tr>
              <td>${a.agent_id}</td>
              <td>${a.name}</td>
              <td>${a.model}</td>
              <td>Coding: ${a.capabilities.coding} | Reasoning: ${a.capabilities.reasoning}</td>
              <td>${a.status}</td>
            </tr>
          `;
        });
      } catch (err) {
        document.getElementById("agentsBody").innerHTML = "<tr><td colspan='5'>Backend not reached</td></tr>";
      }
    }

    async function handleDecompose() {
      const text = document.getElementById("reqInput").value;
      if (!text) {
        alert("Please enter requirements.");
        return;
      }
      try {
        const res = await fetch(`${API}/api/decompose`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ requirement_text: text })
        });
        const data = await res.json();
        document.getElementById("outTitle").innerText = data.project_title;
        const tasksBody = document.getElementById("tasksBody");
        tasksBody.innerHTML = "";
        data.tasks.forEach(t => {
          const deps = (t.dependencies && t.dependencies.length > 0) ? t.dependencies.join(", ") : "None";
          tasksBody.innerHTML += `
            <tr>
              <td>${t.task_id}</td>
              <td>${t.title}</td>
              <td>${t.category}</td>
              <td>${t.description}</td>
              <td>${deps}</td>
            </tr>
          `;
        });
        document.getElementById("outputCard").style.display = "block";
      } catch (err) {
        alert("Error: " + err.message);
      }
    }

    loadAgents();
  </script>
</body>
</html>
