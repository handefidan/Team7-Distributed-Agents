<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Team 7 - Distributed AI Platform</title>
  <style>
    body { font-family: sans-serif; background: #f8fafc; color: #0f172a; padding: 20px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    textarea { width: 100%; height: 120px; box-sizing: border-box; padding: 8px; }
    input[type="text"], input[type="number"] { padding: 8px; margin-right: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 10px 18px; cursor: pointer; font-weight: bold; }
    button.danger { background: #dc2626; padding: 6px 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #e2e8f0; padding: 8px; text-align: left; }
    th { background: #f1f5f9; }
  </style>
</head>
<body>
  <div style="max-width: 900px; margin: 0 auto;">
    <h1>Distributed AI Platform</h1>
    <p>CM6453 Sprint 1 Increment</p>

    <!-- Agent Registry Section -->
    <div class="card">
      <h2>1. Registered Agents</h2>
      
      <div style="margin-bottom: 16px; padding: 12px; background: #f1f5f9; border-radius: 6px;">
        <strong>Add New Agent:</strong><br><br>
        <input type="text" id="newAgentName" placeholder="Agent Name (e.g. Agent-D)">
        <input type="text" id="newAgentModel" placeholder="Model (e.g. llama3.2)">
        <input type="number" id="newAgentCoding" placeholder="Coding (0-100)" min="0" max="100" style="width: 110px;">
        <input type="number" id="newAgentReasoning" placeholder="Reasoning (0-100)" min="0" max="100" style="width: 130px;">
        <input type="number" id="newAgentContext" placeholder="Context (0-100)" min="0" max="100" style="width: 120px;">
        <button onclick="handleAddAgent()">Register Agent</button>
      </div>

      <table id="agentsTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Model</th>
            <th>Capabilities</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="agentsBody">
          <tr><td colspan="6">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Task Decomposition Section -->
    <div class="card">
      <h2>2. Master Agent - Task Decomposition</h2>
      <textarea id="reqInput" placeholder="Enter requirements here..."></textarea><br><br>
      <button onclick="handleDecompose()">Decompose Requirements</button>
    </div>

    <div class="card" id="outputCard" style="display:none;">
      <h2 id="outTitle">Tasks</h2>
      <table>
        <thead>
          <tr>
            <th>Task ID</th>
            <th>Title</th>
            <th>Domain</th>
            <th>Description</th>
            <th>Dependencies</th>
          </tr>
        </thead>
        <tbody id="tasksBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API = "http://localhost:8000";

    async function loadAgents() {
      try {
        const res = await fetch(`${API}/api/agents`);
        const data = await res.json();
        const tbody = document.getElementById("agentsBody");
        tbody.innerHTML = "";
        
        if (data.length === 0) {
            tbody.innerHTML = "<tr><td colspan='6'>No agents registered.</td></tr>";
            return;
        }

        data.forEach(a => {
          tbody.innerHTML += `
            <tr>
              <td>${a.agent_id}</td>
              <td><strong>${a.name}</strong></td>
              <td>${a.model}</td>
              <td>Coding: ${a.capabilities?.coding || 0} | R: ${a.capabilities?.reasoning || 0} | C: ${a.capabilities?.context || 0}</td>
              <td>${a.status}</td>
              <td><button class="danger" onclick="handleRemoveAgent('${a.name}')">Remove</button></td>
            </tr>
          `;
        });
      } catch (err) {
        document.getElementById("agentsBody").innerHTML = "<tr><td colspan='6'>Backend not reached</td></tr>";
      }
    }

    async function handleAddAgent() {
      const name = document.getElementById("newAgentName").value;
      const model = document.getElementById("newAgentModel").value;
      const coding = parseInt(document.getElementById("newAgentCoding").value) || 0;
      const reasoning = parseInt(document.getElementById("newAgentReasoning").value) || 0;
      const context = parseInt(document.getElementById("newAgentContext").value) || 0;

      if (!name || !model) {
        alert("Agent Name and Model are required.");
        return;
      }

      try {
        const res = await fetch(`${API}/api/agents`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: name,
            model: model,
            capabilities: { coding, reasoning, context }
          })
        });
        
        const data = await res.json();
        if (!res.ok) {
            alert("Error: " + (data.detail || "Failed to add agent"));
        } else {
            document.getElementById("newAgentName").value = "";
            document.getElementById("newAgentModel").value = "";
            loadAgents();
        }
      } catch (err) {
        alert("Error: " + err.message);
      }
    }

    async function handleRemoveAgent(agentName) {
      if (!confirm(`Are you sure you want to remove ${agentName}?`)) return;
      
      try {
        const res = await fetch(`${API}/api/agents/${agentName}`, { method: "DELETE" });
        if (!res.ok) {
            const data = await res.json();
            alert("Error: " + data.detail);
        } else {
            loadAgents();
        }
      } catch (err) {
        alert("Error: " + err.message);
      }
    }

    async function handleDecompose() {
      const text = document.getElementById("reqInput").value;
      if (!text) {
        alert("Please enter a requirement text.");
        return;
      }
      
      try {
        const res = await fetch(`${API}/api/decompose`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ requirement_text: text })
        });
        
        const data = await res.json();
        if (!res.ok) {
            alert("Error: " + (data.detail || "Failed to decompose"));
            return;
        }

        document.getElementById("outTitle").innerText = data.project_title || "Tasks";
        const tasksBody = document.getElementById("tasksBody");
        tasksBody.innerHTML = "";
        
        data.tasks.forEach(t => {
          const deps = (t.dependencies && t.dependencies.length > 0) ? t.dependencies.join(", ") : "None";
          tasksBody.innerHTML += `
            <tr>
              <td>${t.task_id}</td>
              <td>${t.title}</td>
              <td>${t.category}</td>
              <td>${t.description}</td>
              <td>${deps}</td>
            </tr>
          `;
        });
        document.getElementById("outputCard").style.display = "block";
      } catch (err) {
        alert("Error: " + err.message);
      }
    }

    loadAgents();
  </script>
</body>
</html>
